# GitHub Pages — free, credit-free static hosting for the CLEARIT site.
# Pushes to `main` automatically redeploy (public repo => no monthly credit cap,
# unlike Netlify's new credits-based deploy blocking).
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only the static site in deploy/ (not the SQL/migration files).
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
